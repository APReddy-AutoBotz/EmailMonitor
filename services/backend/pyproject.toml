[project]
name = "emailmonitor-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "sqlparse==0.6.0",
    "pg8000==1.31.5",
    "pyjwt[crypto]==2.15.1",
    "celery==5.6.3",
    "pypdf==6.20.1",
    "idna==3.20",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==1.20.2",
    "jsonschema==4.26.0",
    "types-jsonschema==4.26.0.20261006",
    "playwright==1.63.0",
    "pyee==13.0.1",
    "greenlet==3.5.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "../../tests", "../../scripts/isolation"]
testpaths = ["tests", "../../tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "services/backend/src:services/backend/tests:tests:scripts/isolation"
files = ["src", "tests", "../../tests"]

[[tool.mypy.overrides]]
module = ["celery", "kombu", "kombu.exceptions"]
ignore_missing_imports = true
