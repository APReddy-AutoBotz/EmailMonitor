name: One initial-event Elsevier sample validation

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: elsevier-one-sample-pr42-initial
  cancel-in-progress: false

jobs:
  private-sample:
    if: >-
      github.event.action == 'opened' && github.event.number == 42 &&
      github.run_attempt == 1 && github.repository == 'APReddy-AutoBotz/EmailMonitor' &&
      github.event.pull_request.head.repo.full_name == 'APReddy-AutoBotz/EmailMonitor' &&
      github.event.pull_request.base.repo.full_name == 'APReddy-AutoBotz/EmailMonitor' &&
      github.head_ref == 'feat/elsevier-one-sample-validation' &&
      github.base_ref == 'feat/private-offline-sample-admission' &&
      github.event.pull_request.base.sha == '158c7db1005a3398604aeca4cd60fdaca176ce9b'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Install existing pinned build tools and locked dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/tooling"
          "$RUNNER_TEMP/tooling/bin/python" -m pip install uv==0.12.23
          echo "$RUNNER_TEMP/tooling/bin" >> "$GITHUB_PATH"
          npm install --global pnpm@11.25.0
          "$RUNNER_TEMP/tooling/bin/uv" sync --project services/backend --locked
      - name: Validate one scoped sample and remove private resources
        env:
          PYTHONPATH: services/backend/src
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --project services/backend python scripts/packaging/run_private_sample_once.py
