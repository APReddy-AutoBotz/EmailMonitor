name: Service reference runtime checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install existing pinned build tools and locked dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/tooling"
          "$RUNNER_TEMP/tooling/bin/python" -m pip install uv==0.12.23
          echo "$RUNNER_TEMP/tooling/bin" >> "$GITHUB_PATH"
          npm install --global pnpm@11.25.0
          "$RUNNER_TEMP/tooling/bin/uv" sync --project services/backend --locked
          pnpm --dir apps/web install --frozen-lockfile --strict-peer-dependencies
      - name: Actual service artifact builds and network-none entrypoint checks
        env:
          EM_REQUIRE_SERVICE_PACKAGING: synthetic-test-only
          PYTHONPATH: services/backend/src
        run: uv run --project services/backend python scripts/packaging/run_service_acceptance.py

  installed-operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      rabbitmq:
        image: rabbitmq:4.3.6@sha256:42b190dffdd0cdb656f989f5404c30e1049d6b7d9c987089669b1905e5e3a1a6
        env:
          RABBITMQ_DEFAULT_USER: em_fixture
          RABBITMQ_DEFAULT_PASS: emailmonitor-ci-broker-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 18
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_PASSWORD: emailmonitor-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EM_REQUIRE_OPERATOR_UI: "true"
      EM_REQUIRE_REAL_BROKER: "true"
      EM_TEST_DISPOSABLE_BROKER: "true"
      EM_TEST_BROKER_URL: pyamqp://em_fixture:emailmonitor-ci-broker-only@127.0.0.1:5672//
      EM_TEST_ADMIN_DATABASE_URL: postgresql+pg8000://postgres:emailmonitor-ci-only@127.0.0.1:5432/postgres
      EM_TEST_AUTH_DATABASE_URL: postgresql+pg8000://em_ci_authenticator:emailmonitor-ci-auth-only@127.0.0.1:5432/postgres
      EM_TEST_DATABASE_URL: postgresql+pg8000://em_ci_runtime:emailmonitor-ci-runtime-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install pinned development tools
        run: |
          python3 -m venv "$RUNNER_TEMP/tooling"
          "$RUNNER_TEMP/tooling/bin/python" -m pip install uv==0.12.23
          echo "$RUNNER_TEMP/tooling/bin" >> "$GITHUB_PATH"
          npm install --global pnpm@11.25.0
      - name: Install locked dependencies and create disposable database roles
        id: service-prerequisites
        run: |
          uv sync --project services/backend --locked
          EM_MIGRATION_DATABASE_URL="$EM_TEST_ADMIN_DATABASE_URL" uv run --project services/backend alembic -c services/backend/alembic.ini upgrade head
          uv run --project services/backend python scripts/create_ci_runtime.py
      - name: Build actual locked operator UI
        id: service-web
        run: |
          pnpm --dir apps/web install --frozen-lockfile --strict-peer-dependencies
          pnpm --dir apps/web peers check
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web lint
          pnpm --dir apps/web test
          pnpm --dir apps/web build
      - name: Focused actual service broker acceptance
        timeout-minutes: 5
        env:
          EM_TEST_BROKER_CONTAINER: ${{ job.services.rabbitmq.id }}
          PYTHONPATH: services/backend/src:services/backend/tests:tests:scripts/isolation:scripts/packaging
        run: uv run --project services/backend pytest services/backend/tests/test_service_runtime_broker.py -v --tb=short
      - name: Installed service API and independent worker operator acceptance
        id: installed-operator-test
        if: ${{ !cancelled() && steps.service-prerequisites.outcome == 'success' && steps.service-web.outcome == 'success' }}
        env:
          EM_REQUIRE_INSTALLED_OPERATOR: "true"
          EM_INSTALLED_STAGE_REPORT: "true"
          EM_GUEST_OUTCOME_REPORT: "true"
          PYTHONPATH: services/backend/src:services/backend/tests:tests:scripts/isolation:scripts/packaging
        run: uv run --project services/backend pytest scripts/isolation/test_installed_operator_acceptance.py -v -s
      - name: "Installed operator stage: ${{ steps.installed-operator-test.outputs.stage || 'fixture_or_report_unavailable' }}"
        if: ${{ !cancelled() && steps.installed-operator-test.outcome != 'skipped' }}
        run: ':'
      - name: "Installed guest outcome: ${{ steps.installed-operator-test.outputs.guest_outcome || 'unavailable' }}"
        if: ${{ !cancelled() && steps.installed-operator-test.outcome != 'skipped' }}
        run: ':'
      - name: Installed controlled XML service and curated parser acceptance
        id: installed-xml-test
        if: ${{ !cancelled() && steps.service-prerequisites.outcome == 'success' && steps.service-web.outcome == 'success' }}
        env:
          EM_REQUIRE_INSTALLED_OPERATOR: "true"
          EM_REQUIRE_CONTROLLED_NETWORK: "true"
          EM_REQUIRE_XML_INTEGRATION: "synthetic-test-only"
          EM_BACKEND_OUTCOME_REPORT: "true"
          EM_XML_CASE_OUTCOME_REPORT: "true"
          PYTHONPATH: services/backend/src:services/backend/tests:tests:scripts/isolation:scripts/packaging
        run: uv run --project services/backend python scripts/packaging/run_xml_integration.py installed
      - name: "Installed XML outcome: ${{ steps.installed-xml-test.outputs.backend_outcome || 'unavailable' }}"
        if: ${{ !cancelled() && steps.installed-xml-test.outcome != 'skipped' }}
        run: ':'
      - name: "Installed XML check: ${{ steps.installed-xml-test.outputs.xml_check || 'consumer_not_reached' }}"
        if: ${{ !cancelled() && steps.installed-xml-test.outcome != 'skipped' }}
        run: ':'
      - name: "Installed XML first failure: ${{ steps.installed-xml-test.outputs.xml_failure || 'unavailable' }}"
        if: ${{ !cancelled() && steps.installed-xml-test.outcome != 'skipped' }}
        run: ':'
