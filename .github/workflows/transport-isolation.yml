name: Controlled synthetic transport isolation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      rabbitmq:
        image: rabbitmq:4.3.6@sha256:42b190dffdd0cdb656f989f5404c30e1049d6b7d9c987089669b1905e5e3a1a6
        env:
          RABBITMQ_DEFAULT_USER: em_fixture
          RABBITMQ_DEFAULT_PASS: emailmonitor-ci-broker-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 18
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_PASSWORD: emailmonitor-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EM_REQUIRE_OPERATOR_UI: "true"
      EM_REQUIRE_REAL_BROKER: "true"
      EM_TEST_DISPOSABLE_BROKER: "true"
      EM_TEST_BROKER_URL: pyamqp://em_fixture:emailmonitor-ci-broker-only@127.0.0.1:5672//
      EM_REQUIRE_CONTROLLED_NETWORK: "true"
      EM_TEST_ADMIN_DATABASE_URL: postgresql+pg8000://postgres:emailmonitor-ci-only@127.0.0.1:5432/postgres
      EM_TEST_AUTH_DATABASE_URL: postgresql+pg8000://em_ci_authenticator:emailmonitor-ci-auth-only@127.0.0.1:5432/postgres
      EM_TEST_DATABASE_URL: postgresql+pg8000://em_ci_runtime:emailmonitor-ci-runtime-only@127.0.0.1:5432/postgres
      PYTHONPATH: services/backend/src:services/backend/tests:tests:scripts/isolation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install locked diagnostic dependencies and create disposable tenant roles
        run: |
          python3 -m venv "$RUNNER_TEMP/tooling"
          "$RUNNER_TEMP/tooling/bin/python" -m pip install uv==0.12.23
          echo "$RUNNER_TEMP/tooling/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tooling/bin/uv" sync --project services/backend --locked
          EM_MIGRATION_DATABASE_URL="$EM_TEST_ADMIN_DATABASE_URL" "$RUNNER_TEMP/tooling/bin/uv" run --project services/backend alembic -c services/backend/alembic.ini upgrade head
          "$RUNNER_TEMP/tooling/bin/uv" run --project services/backend python scripts/create_ci_runtime.py
      - name: Build actual locked operator UI
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir apps/web install --frozen-lockfile --strict-peer-dependencies
          pnpm --dir apps/web build
      - name: Trusted image preparation, approved initialization and curated XML acceptance
        env:
          EM_REQUIRE_XML_INTEGRATION: "synthetic-test-only"
        run: uv run --project services/backend python scripts/packaging/run_xml_integration.py transport
