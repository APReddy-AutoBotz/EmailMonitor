name: Synthetic capture pixel regression

on:
  push:
    branches: [codex/capture-pixel-regression-20261102]

permissions:
  contents: read

jobs:
  capture-pixel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate source identity
        run: |
          # Candidate b1979d1a21fc063fbe723f70695965b096a723f5, tree e1852716619cdda465aaa838d0cc17f810e7c85a; Docker ignore adds only the diagnostic.
          git merge-base --is-ancestor e3f068c8c93a72536922527969b8d7a3ed5d34be HEAD
          test "$(git rev-parse e3f068c8c93a72536922527969b8d7a3ed5d34be^{tree})" = 0756d919cf3f8aa9ca87a3251a6b97f87e1b287a
          while read -r expected path; do
            test "$(git rev-parse "HEAD:$path")" = "$expected"
          done <<'BLOBS'
          5fcb3ddbcfe23773e00ecadf32d71cc7df4d5240 .dockerignore
          849477dea406cb9d529e8d767d70e9b0c8705477 docs/41-offline-operator-ui-runbook.md
          ae285cdbd6b7e7d21cb7c6c6db736cd1446cc113 scripts/isolation/Dockerfile.operator-ui
          79df7f4a77c18238a91acfead0c071c99f55ed82 scripts/isolation/operator_capture.py
          452eaca0fe1b825d8bdfc34e273e0b87a15299a2 scripts/isolation/operator_ui_protocol.py
          82a904c7d8fab90136820cd6675c89453ce7ac83 scripts/isolation/test_operator_capture_pixels.py
          64a075ef969585ba64c58858857d609ad5417aa5 services/backend/tests/test_operator_capture.py
          BLOBS
          git diff --quiet e3f068c8c93a72536922527969b8d7a3ed5d34be HEAD -- . \
            ':(exclude).dockerignore' \
            ':(exclude)docs/41-offline-operator-ui-runbook.md' \
            ':(exclude)scripts/isolation/Dockerfile.operator-ui' \
            ':(exclude)scripts/isolation/operator_capture.py' \
            ':(exclude)scripts/isolation/operator_ui_protocol.py' \
            ':(exclude)scripts/isolation/test_operator_capture_pixels.py' \
            ':(exclude)services/backend/tests/test_operator_capture.py' \
            ':(exclude).github/workflows/capture-pixel-regression.yml' \
            ':(exclude)scripts/isolation/Dockerfile.capture-pixel' \
            ':(exclude)scripts/isolation/capture_pixel_diagnostic.py' \
            ':(exclude)scripts/isolation/run_capture_pixel_regression.py' \
            ':(exclude)services/backend/tests/test_capture_pixel_regression_runner.py'
      - name: Install pinned tooling and locked dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/tooling"
          "$RUNNER_TEMP/tooling/bin/python" -m pip install uv==0.12.23
          echo "$RUNNER_TEMP/tooling/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tooling/bin/uv" sync --project services/backend --locked
      - name: Run isolated synthetic Chromium pixel regression
        env:
          PYTHONPATH: services/backend/src:tests:scripts/isolation
        run: uv run --project services/backend python scripts/isolation/run_capture_pixel_regression.py
